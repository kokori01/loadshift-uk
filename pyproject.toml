[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loadshift-uk"
version = "0.2.0"
description = "Forecasting and decision intelligence for flexible UK electricity demand"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.4",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
data = [
  "duckdb>=1.3,<2",
]
ml = [
  "lightgbm>=4.6,<5",
  "mlflow>=3.1,<4",
  "scikit-learn>=1.7,<2",
]
dev = [
  "mypy>=1.16,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
loadshift = "loadshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["loadshift"]
